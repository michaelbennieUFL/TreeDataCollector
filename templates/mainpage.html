<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Forest Map with Unlabeled Polygons</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Our custom JavaScript file -->
  <script src="../static/forest.js" defer></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    #app {
      display: flex;
      height: 100%;
      width: 100%;
    }

    /* Left Sidebar */
    #sidebar {
      width: 320px;
      min-width: 200px;
      padding: 10px;
      box-sizing: border-box;
      border-right: 1px solid #ccc;
      background: #f4f4f4;
      overflow-y: auto;
    }
    #sidebar h3 {
      margin-top: 0;
    }
    .status-item {
      margin-bottom: 10px;
      cursor: pointer;
    }
    .color-swatch {
      display: inline-block;
      vertical-align: middle;
      width: 16px;
      height: 16px;
      margin-right: 8px;
      border: 1px solid #999;
    }
    .submenu {
      display: none;
      margin-left: 24px;
      margin-top: 4px;
    }
    .submenu input[type=color] {
      border: 1px solid #ccc;
      cursor: pointer;
      width: 40px;
      height: 24px;
      padding: 0;
    }
    .submenu.open {
      display: block;
    }

    /* Edit Labels */
    #edit-labels {
      margin: 16px 0;
      padding: 8px;
      border: 1px solid #ddd;
    }
    #edit-labels input[type=text] {
      width: 120px;
      margin-left: 5px;
    }

    /* Mouse info area */
    #coords {
      margin: 8px 0;
      padding: 4px;
      border: 1px solid #ccc;
      background: #fff;
      font-size: 14px;
      white-space: pre; /* preserve line breaks */
    }

    /* Data Table */
    #table-container {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 8px;
      border: 1px solid #ccc;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 4px 6px;
      text-align: left;
      cursor: default;
    }
    th {
      background: #eee;
      user-select: none;
      cursor: pointer;
    }
    tr.selected {
      background: #ffe6b3; /* highlight color */
    }

    /* The Map */
    #map {
      flex: 1;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <div id="sidebar">
      <h3>Forest Status Colors</h3>
      <div id="status-colors"></div>

      <!-- Edit Labels -->
      <div id="edit-labels">
        <h4>Edit Labels</h4>
        <p>Select a polygon, then edit fields below:</p>
        <div>
          <label for="editLatin">Latin name:</label>
          <input type="text" id="editLatin" placeholder="Latin Name"/>
        </div>
        <div style="margin-top:6px;">
          <label for="editStatus">Status:</label>
          <input type="text" id="editStatus" placeholder="Status"/>
        </div>
        <button id="saveStatusBtn" style="margin-top:8px;">Submit</button>
      </div>

      <!-- Mouse info -->
      <div id="coords">
        Mouse: (lat, lng)
      </div>

      <!-- Data Table -->
      <div id="table-container">
        <table id="forest-table">
          <thead>
            <tr>
              <th data-key="latin">Latin Name</th>
              <th data-key="status">Status</th>
              <th data-key="area">Area</th>
              <th data-key="GlobalID">Global ID</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Main Map Container -->
    <div id="map"></div>
  </div>
</body>
</html>
